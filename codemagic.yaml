workflows:
  wireguard_build:  # نام Workflow
    name: WireGuard Build
    instance_type: mac_mini_m1  # برای بیلد iOS به macOS نیاز داریم
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
    environment:
      groups:
        - wireguard_keys  # گروه متغیرهای محیطی برای امضا
      vars:
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_HOME: $HOME/android-sdk
        PATH: $ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH
    scripts:
      - name: Install required tools
        script: |
          brew install flock coreutils cmake ninja
    
      - name: Setup Android SDK
        script: |
          mkdir -p $ANDROID_HOME/cmdline-tools/
          cd $ANDROID_HOME/cmdline-tools/
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-mac-8512546_latest.zip
          unzip sdk.zip
          rm sdk.zip
          chmod +x cmdline-tools/bin/sdkmanager
          yes | cmdline-tools/bin/sdkmanager --licenses
          bash cmdline-tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
    
      - name: Build Android APK & AAB
        script: |
          export PATH="/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH"
          find ./ -type f
         # ./gradlew assembleRelease
        # ./gradlew bundleRelease
      

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
