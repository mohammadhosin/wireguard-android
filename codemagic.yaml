workflows:
  wireguard_build:
    name: WireGuard Build
    instance_type: mac_mini_m1  # نیاز به macOS برای بیلد iOS
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
    environment:
      groups:
        - wireguard_keys  # گروه متغیرهای محیطی برای امضا
      vars:
        FLUTTER_VERSION: stable
    scripts:
      - name: Setup Android SDK
        script: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build Android APK & AAB
        script: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Build iOS
        script: |
          xcodebuild -workspace WireGuard.xcworkspace \
                     -scheme WireGuard \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/WireGuard.xcarchive \
                     archive

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - build/WireGuard.xcarchive/**/*.ipa